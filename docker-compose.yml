services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitquest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitquest}
      POSTGRES_DB: ${POSTGRES_DB:-fitquest}
    volumes:
      - fitbaddy_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitquest}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend-fit-baddy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-fitquest}:${POSTGRES_PASSWORD:-fitquest}@db:5432/${POSTGRES_DB:-fitquest}
      SECRET_KEY: ${SECRET_KEY:-CHANGE_ME_dev_only_secret}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend-fit-baddy/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html

volumes:
  fitbaddy_pgdata:
